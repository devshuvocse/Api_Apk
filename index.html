<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Application</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="icon-wrapper" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <h1>অ্যাপ্লিকেশন ডাউনলোড করুন</h1>
      <p class="subtitle">নিচের বাটনে ক্লিক করে অ্যাপটি ডাউনলোড করুন এবং দেওয়া ইউজারনেম ও পাসওয়ার্ড ব্যবহার করে লগইন করুন।</p>

      <!-- লগইন তথ্য (Username & Password) -->
      <div class="credentials-box">
        <div class="cred-row">
          <div class="cred-info">
            <span class="cred-label">Username</span>
            <code class="cred-value" id="usernameVal">FTP@123456789</code>
          </div>
          <button type="button" class="copy-btn" data-copy="FTP@123456789" aria-label="Copy Username">
            Copy
          </button>
        </div>
        <div class="cred-divider"></div>
        <div class="cred-row">
          <div class="cred-info">
            <span class="cred-label">Password</span>
            <code class="cred-value" id="passwordVal">FTP@123456789</code>
          </div>
          <button type="button" class="copy-btn" data-copy="FTP@123456789" aria-label="Copy Password">
            Copy
          </button>
        </div>
      </div>
      
      <!-- অ্যাপ ফাইলের নাম: app.apk -->
      <a href="./app.apk" download="app.apk" class="download-btn" id="downloadBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download Now</span>
      </a>

      <span class="status-text" id="statusText">Direct &amp; Secure Download</span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
